name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Bewusst ohne fremde Actions: git holt genau den zu prüfenden Commit.
      - name: Quelltext holen
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='Commit %H'

      - name: Rust stable mit rustfmt und clippy
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Keine externen Abhängigkeiten
        run: cargo run --locked -p deps-guard

      - name: Generierte Tabellen aktuell
        run: cargo run --locked -p datagen -- --check

      - name: Formatierung
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all --check

      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Externe Testdaten holen
        run: cargo run --locked -p testdata

      - name: Tests
        run: cargo test --locked --workspace

      # M1: die Referenztests aus tools/testrunner/m1-referenztests.txt, mit
      # den Schriften des Systems. Vorerst nur unter Linux, wo die Liste
      # geprüft ist.
      - name: Referenztests für M1
        if: runner.os == 'Linux'
        run: cargo run --locked --release -p testrunner

      # M0: Ein Fenster zeigt das selbst gezeichnete Testbild. Der Selbsttest
      # liest es aus dem Fenster zurück und prüft feste Messpunkte.
      - name: Selbsttest mit Fenster (Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
          xvfb-run -a -s "-screen 0 1024x768x24" cargo run --locked -p meinbrowser -- --selbsttest

      - name: Selbsttest mit Fenster
        if: runner.os != 'Linux'
        run: cargo run --locked -p meinbrowser -- --selbsttest
