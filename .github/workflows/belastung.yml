name: Belastungstests

# Nächtliche Belastungstests im Release-Build: für den Garbage Collector
# (Schritt 10 in docs/architektur.md, 12.2) Test262 und GC-lastige Programme
# im Belastungsmodus des Heaps, siehe docs/m2-test262-ausfuehrung.md,
# Abschnitt „Nächtliche Belastungstests“; für SHA-256 die großen Nachrichten
# des ACVP von 1 bis 8 GiB (Schritt 11a, crates/mb-crypto/src/sha256/tests.rs).

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/mb-js/src/heap.rs"
      - "crates/mb-js/src/heap/**"
      - ".github/workflows/belastung.yml"

permissions:
  contents: read

concurrency:
  group: belastung-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  stress:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: test262-language
            package: mb-js
            testdata: true
            tests: test262_language_under_stress
          - part: test262-built-ins
            package: mb-js
            testdata: true
            tests: test262_built_ins_under_stress test262_annex_b_built_ins_under_stress
          - part: gc-programme
            package: mb-js
            testdata: false
            tests: "script::gc_tests::"
          - part: sha256-grosse-nachrichten
            package: mb-crypto
            testdata: true
            tests: acvp_large_data
    env:
      STRESS_PACKAGE: ${{ matrix.package }}
      STRESS_TESTS: ${{ matrix.tests }}
    steps:
      # Wie in ci.yml: keine fremden Actions, nur der genaue Commit.
      - name: Quelltext holen
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='Commit %H'

      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Externe Testdaten holen
        if: matrix.testdata
        run: cargo run --locked -p testdata

      - name: Belastungstests im Release-Build
        run: |
          read -ra filters <<< "$STRESS_TESTS"
          cargo test --locked --release -p "$STRESS_PACKAGE" --lib -- --ignored --nocapture "${filters[@]}"
