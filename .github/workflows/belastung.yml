name: Belastungstests

# Nächtliche Belastungstests für den Garbage Collector (Schritt 10 in
# docs/architektur.md, 12.2): Test262 und GC-lastige Programme im
# Belastungsmodus des Heaps, im Release-Build. Siehe
# docs/m2-test262-ausfuehrung.md, Abschnitt „Nächtliche Belastungstests“.

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/mb-js/src/heap.rs"
      - "crates/mb-js/src/heap/**"
      - ".github/workflows/belastung.yml"

permissions:
  contents: read

concurrency:
  group: belastung-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  stress:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: test262-language
            testdata: true
            tests: test262_language_under_stress
          - part: test262-built-ins
            testdata: true
            tests: test262_built_ins_under_stress test262_annex_b_built_ins_under_stress
          - part: gc-programme
            testdata: false
            tests: "script::gc_tests::"
    env:
      STRESS_TESTS: ${{ matrix.tests }}
    steps:
      # Wie in ci.yml: keine fremden Actions, nur der genaue Commit.
      - name: Quelltext holen
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='Commit %H'

      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Externe Testdaten holen
        if: matrix.testdata
        run: cargo run --locked -p testdata

      - name: Belastungstests im Release-Build
        run: |
          read -ra filters <<< "$STRESS_TESTS"
          cargo test --locked --release -p mb-js --lib -- --ignored --nocapture "${filters[@]}"
