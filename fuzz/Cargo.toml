[package]
name = "meinbrowser-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Development-only workspace: never a dependency of the browser.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
mb-base = { path = "../crates/mb-base" }
mb-compress = { path = "../crates/mb-compress" }
mb-css = { path = "../crates/mb-css" }
mb-encoding = { path = "../crates/mb-encoding" }
mb-html = { path = "../crates/mb-html" }
mb-image = { path = "../crates/mb-image" }
mb-js = { path = "../crates/mb-js" }
mb-json = { path = "../crates/mb-json" }
mb-layout = { path = "../crates/mb-layout" }
mb-style = { path = "../crates/mb-style" }
mb-text = { path = "../crates/mb-text" }
mb-unicode = { path = "../crates/mb-unicode" }
mb-url = { path = "../crates/mb-url" }
mb-web = { path = "../crates/mb-web" }
mb-xml = { path = "../crates/mb-xml" }

[dev-dependencies]
mb-scene = { path = "../crates/mb-scene" }

[profile.release]
debug = 1

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false
bench = false

